name: Fred Perry Preis-Waechter

on:
  schedule:
    # 3x täglich (UTC): 7, 15 und 23 Uhr deutscher Winterzeit
    - cron: "0 6,14,22 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Bereits gemeldete Angebote laden
        uses: actions/cache@v4
        with:
          path: gesehene_angebote.json
          key: gesehene-${{ github.run_id }}
          restore-keys: gesehene-

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Angebote pruefen
        run: python price_watch.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_APP_PASSWORT: ${{ secrets.GMAIL_APP_PASSWORT }}
          EMPFAENGER: ${{ secrets.EMPFAENGER }}
